plugins {
    id 'com.android.application'
}

// Versão única: vem do `version` do Cargo.toml da raiz (o menu mostra a mesma).
def cargoVersion = {
    def m = (new File(rootDir, '../Cargo.toml').text =~ /(?m)^version\s*=\s*"([^"]+)"/)
    m.find() ? m.group(1) : '0.0.0'
}()
def cargoVersionCode = cargoVersion.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }.with { (it[0] ?: 0) * 10000 + (it[1] ?: 0) * 100 + (it[2] ?: 0) }

// A biblioteca nativa vem do cargo-ndk: `cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p rnfe-android --release`
android {
    namespace 'com.caua726.rnfe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.caua726.rnfe'
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode cargoVersionCode
        versionName cargoVersion
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }

    // Assinatura de release: variáveis de ambiente do CI (secrets); sem elas, a keystore de debug.
    def ksPath = System.getenv('RNFE_KEYSTORE')
    signingConfigs {
        release {
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv('RNFE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RNFE_KEY_ALIAS')
                keyPassword System.getenv('RNFE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def useRelease = ksPath != null && file(ksPath).exists()
            signingConfig = useRelease ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions { jniLibs { useLegacyPackaging = false } }
}

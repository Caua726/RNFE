plugins {
    id 'com.android.application'
}

// A biblioteca nativa vem do cargo-ndk: `cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build -p rnfe-android --release`
android {
    namespace 'com.caua726.rnfe'
    compileSdk 34

    defaultConfig {
        applicationId 'com.caua726.rnfe'
        minSdk 26          // Android 8.0
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets { main { jniLibs.srcDirs = ['src/main/jniLibs'] } }

    buildTypes {
        release {
            minifyEnabled false
            // Sem keystore própria ainda: assina com a de debug para o APK instalar.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions { jniLibs { useLegacyPackaging = false } }
}

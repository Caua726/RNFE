[package]
name = "rnfe-core"
description = "Núcleo do emulador de Famicom RNFE: CPU 6502, PPU, APU, bus, cartuchos e mappers. Sem dependências."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Save states (`Nes::save_state`/`load_state`) e rewind: serde + postcard, sem std neles.
serde = ["dep:serde", "dep:postcard"]
# Só para medir: a PPU vira um contador de dots (sem render, sem VBL). Nunca em builds normais.
profile-no-ppu = []

[dependencies]
log.workspace = true
serde = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }

[lints]
workspace = true

[package]
name = "rnfe-gui"
description = "Frontend gráfico do RNFE (winit + wgpu + cpal), compartilhado por desktop, web e Android."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gamepad"]
# Gamepads via gilrs (desktop) / Gamepad API (web).
gamepad = ["dep:gilrs"]

[dependencies]
rnfe-core = { workspace = true, features = ["serde"] }
rnfe-frontend.workspace = true
log.workspace = true
wgpu.workspace = true
winit = { workspace = true, features = ["x11", "wayland"] }
cpal.workspace = true
bytemuck.workspace = true
fontdue.workspace = true
web-time = "1"
gilrs = { version = "0.11", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# Diálogo de arquivo: desktop e web. No Android a ROM chega pelo `Launch::picker` (SAF via JNI).
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
cpal = { workspace = true, features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "CssStyleDeclaration", "Storage"] }
console_error_panic_hook = "0.1"
console_log = "1"

[lints]
workspace = true

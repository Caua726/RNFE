name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RNFE_REQUIRE_ROMS: "1"   # no CI, ROM de teste ausente é erro, não skip

jobs:
  core:
    name: núcleo — fmt, clippy, testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: core
      - name: ROMs de teste (cache)
        uses: actions/cache@v4
        with:
          path: test-roms
          key: test-roms-${{ hashFiles('scripts/fetch-roms.sh') }}
      - run: bash scripts/fetch-roms.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p rnfe-core -p rnfe-frontend -p rnfe-tty --all-targets --features rnfe-core/serde -- -D warnings
      - run: cargo test -p rnfe-core -p rnfe-frontend --features rnfe-core/serde
      - name: STATUS.md no resumo do job
        if: always()
        run: |
          cargo run -q -p rnfe-core --release --bin status >> "$GITHUB_STEP_SUMMARY" || true

  desktop-check:
    name: desktop — cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências de sistema (alsa, udev, xkbcommon)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: cargo check -p rnfe-desktop --all-targets
      - run: cargo clippy -p rnfe-desktop -p rnfe-gui --all-targets -- -D warnings
      - run: cargo test -p rnfe-gui --lib

  web:
    name: web — wasm32 clippy + trunk build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: cargo clippy -p rnfe-gui -p rnfe-web --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: "v0.21.14"
      - run: trunk build --release
      - name: Tamanho do wasm
        run: |
          {
            echo '### Web (dist/)'
            echo '```'
            ls -la dist
            for f in dist/*.wasm; do gzip -9 -c "$f" | wc -c | xargs -I{} echo "$f gzip: {} bytes"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  android:
    name: android — cargo-ndk + gradle (APK de debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Biblioteca nativa (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME_PINNED:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}}"
          echo "NDK: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -P 26 clippy -p rnfe-android -- -D warnings
          CARGO_PROFILE_RELEASE_STRIP=symbols CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 cargo ndk -t arm64-v8a -P 26 -o android/app/src/main/jniLibs build -p rnfe-android --release
          ls -la android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Keystore de release (secrets; sem elas, assina com a de debug)
        env:
          KS_B64: ${{ secrets.RNFE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rnfe-release.jks"
            echo "RNFE_KEYSTORE=$RUNNER_TEMP/rnfe-release.jks" >> "$GITHUB_ENV"
            echo "RNFE_KEYSTORE_PASSWORD=${{ secrets.RNFE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "RNFE_KEY_ALIAS=${{ secrets.RNFE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "RNFE_KEY_PASSWORD=${{ secrets.RNFE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "assinatura: release"
          else
            echo "assinatura: debug (sem secrets)"
          fi
      - name: APK (gradle assembleRelease)
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - run: ls -la android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: rnfe-android-apk
          path: android/app/build/outputs/apk/release/*.apk

  pages:
    name: GitHub Pages
    needs: [web, core]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  bench:
    name: bench (informativo)
    runs-on: ubuntu-latest
    needs: core
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - uses: actions/cache@v4
        with:
          path: test-roms
          key: test-roms-${{ hashFiles('scripts/fetch-roms.sh') }}
      - run: bash scripts/fetch-roms.sh
      - name: Bench
        run: |
          {
            echo '### Bench (ubuntu runner, release)'
            echo '```'
            for r in other/nestest.nes other/BladeBuster.nes mmc3_test_2/rom_singles/1-clocking.nes; do
              cargo run -q -p rnfe-core --release --bin bench -- --rom "test-roms/$r" --frames 2000
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
